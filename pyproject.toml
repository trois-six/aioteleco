[project]
name = "aioteleco"
dynamic = ["version"]
description = "Async Python SDK for Teleco Automation boxes (Daisy): pergolas, awnings, lights — cloud and local control"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "trois-six" }]
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.10"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
  "Typing :: Typed",
]

[project.optional-dependencies]
cli = ["typer>=0.15"]

[project.scripts]
teleco = "aioteleco.cli:main"

[project.urls]
Homepage = "https://github.com/trois-six/aioteleco"
Issues = "https://github.com/trois-six/aioteleco/issues"

[dependency-groups]
dev = [
  "aioresponses>=0.7.8",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
  "typer>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/aioteleco/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aioteleco"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: talks to the real Teleco cloud / box (deselected by default)"]
addopts = "-m 'not live'"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["aioresponses.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PT", "TRY", "N"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]
